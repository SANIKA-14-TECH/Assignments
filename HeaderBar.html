<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Bar</title>
    <style>
        .header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 15px 30px;
        }
        .logo{
            color: white;
            font-size: 22px;
            font-weight: bold;
        }
        .menu a{
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }
        .menu a:hover{
            text-decoration: underline;
            color: rgb(249, 172, 223);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">My Logo</div>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </div>
</body>
</html>
