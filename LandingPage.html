<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Landing Page</title>
    <style>
        *{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}

.hero{
  height:100vh;
  background:url("https://images.unsplash.com/photo-1498050108023-c5249f4df085")
  center/cover no-repeat;
  position:relative;
}

/* overlay */
.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.5);

  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

/* flex content */
.hero-content{
  max-width:700px;
  color:white;
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* responsive typography */
.hero-content h1{
  font-size:clamp(2rem,5vw,3.5rem);
}

.hero-content p{
  font-size:clamp(1rem,2vw,1.25rem);
  line-height:1.6;
}

.hero-btn{
  display:inline-block;
  padding:12px 28px;
  background:#ff6b3d;
  color:white;
  text-decoration:none;
  border-radius:5px;
  font-weight:bold;
  transition:0.3s;
}

.hero-btn:hover{
  background:#ff4c1f;
}

/* mobile adjustments */
@media (max-width:768px){
  .hero{
    height:80vh;
  }
}
    </style> 
</head>
<body>
    <section class="hero">
  <div class="overlay">
    <div class="hero-content">
      <h1>Build Modern Websites</h1>
      <p>
        Learn responsive web design using modern CSS techniques like flexbox,
        overlays, and fluid typography.
      </p>
      <a href="#" class="hero-btn">Get Started</a>
    </div>
  </div>
</section>
</body>
</html>
