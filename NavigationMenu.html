<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanigation Menu</title>
    <style>
    /* Menu container */
    .menu{
    width: 200px;
    }

    /* Menu links */
    .menu a{
        display: block;
        padding: 12px;
        text-decoration: none;
        background-color: #f1f1f1;
        color: black;
    }

    /* Hover effect */
    .menu a:hover{
        background-color: #4CAF50;
        color: white;
    }
    </style>
</head>
<body>
    <div class="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </div>
</body>
</html>
