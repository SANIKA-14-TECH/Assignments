    <title>Image Gallery Grid</title>
    <style>
    
body{
  font-family: Arial, sans-serif;
  background:#f4f4f4;
  padding:20px;
}

/* Grid container */
.gallery{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:15px;
  max-width:900px;
  margin:auto;
}

/* Image wrapper */
.gallery-item{
  overflow:hidden;
  border:4px solid #ddd;
  border-radius:8px;
}

/* Images */
.gallery img{
  width:100%;
  display:block;
  transition: transform 0.4s ease;
  height: 100%;
}

/* Hover zoom effect */
.gallery-item:hover img{
  transform:scale(1.4);
}
