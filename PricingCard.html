<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Table UI</title>
    <style>
        *{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#f5f7fb;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* GRID LAYOUT */
.pricing{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
  gap:30px;
  width:90%;
  max-width:1000px;
}

/* CARD STYLE */
.pricing-card{
  background:white;
  padding:30px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* PRICE */
.price{
  font-size:32px;
  font-weight:bold;
}

.price span{
  font-size:14px;
  color:#777;
}

/* FEATURES */
.pricing-card ul{
  list-style:none;
  display:flex;
  flex-direction:column;
  gap:10px;
  color:#555;
}

/* BUTTON */
.pricing-card button{
  padding:12px;
  border:none;
  background:#4f46e5;
  color:white;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}

.pricing-card button:hover{
  background:#3730a3;
}

/* Highlight Pro Plan */
.popular{
  transform:scale(1.05);
  border:2px solid #4f46e5;
}
    </style>
</head>
<body>
    <section class="pricing">

  <div class="pricing-card">
    <h3>Basic</h3>
    <p class="price">$9<span>/month</span></p>

    <ul>
      <li>1 Website</li>
      <li>Basic Support</li>
      <li>10GB Storage</li>
      <li>Email Support</li>
    </ul>

    <button>Buy Now</button>
  </div>

  <div class="pricing-card popular">
    <h3>Pro</h3>
    <p class="price">$29<span>/month</span></p>

    <ul>
      <li>10 Websites</li>
      <li>Priority Support</li>
      <li>50GB Storage</li>
      <li>Analytics</li>
    </ul>

    <button>Buy Now</button>
  </div>

  <div class="pricing-card">
    <h3>Premium</h3>
    <p class="price">$59<span>/month</span></p>

    <ul>
      <li>Unlimited Websites</li>
      <li>24/7 Support</li>
      <li>200GB Storage</li>
      <li>Advanced Analytics</li>
    </ul>

    <button>Buy Now</button>
  </div>

</section>
</body>
</html>
