<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Design</title>
    <style>
        #btn1{
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        #btn2{
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        #btn1:hover{
            background-color: blue;
        }
        #btn2:hover{
            background-color: gray;
        }
    </style>
</head>
<body>
    <button id="btn1">Click me</button>
    <button id="btn2">Submit</button>
</body>
</html>
