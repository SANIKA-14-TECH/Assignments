<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        body{
            font-family: Arial, sans-serif;
        }
        .card{
            width: 300px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 1);
            text-align: center;
            margin: 50px auto;
            padding: 20px;
        }
        .card img{
            width: 100%;
            border-radius: 10px;
        }
        .card button{
            padding: 10px 20px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 6px;
        }
        .card button:hover{
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="card">
         <img src="Assets/sk.jfif" alt="sanika">
         <h2><b>name :</b>&nbsp Sanika Kolekar</h3>
         <p>Hello, I am sanika. I am from karad. My college name is nanasaheb mahadik college of engineering, peth. </p>
         <button id="btn1">Learn More</button>
    </div>
</body>
</html>
