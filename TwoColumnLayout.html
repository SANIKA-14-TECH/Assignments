<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Two Column Layout</title>
    <style>
        body{
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container{
            display: flex;
            min-height: 100vh;
        }
        .sidebar{
            flex: 1;
            background: #2c3e50;
            color: white;
            padding: 20px;
        }
        .content{
            flex: 3;
            background: #ecf0f1;
            padding: 20px;
        }
        /* small screen */
        @media(max-width:768px){
            .container{
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>Sidebar</h2>
            <p>Navigation Links</p>
        </div>

        <div class="content">
            <h1>Main Content</h1>
            <p>This is the content area.</p>
        </div>
    </div>
</body>
</html>
