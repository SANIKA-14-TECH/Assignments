<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Login Form</title>
    <style>

body{
  font-family: Arial, sans-serif;
  background:#f2f2f2;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* Form container */
.login-box{
  background:white;
  padding:30px;
  width:300px;
  border-radius:8px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.login-box h2{
  text-align:center;
  margin-bottom:20px;
}

/* Input fields */
.login-box input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:5px;
  font-size:16px;
  transition:0.3s;
}

/* Focus effect */
.login-box input:focus{
  border-color:#3498db;
  outline:none;
  box-shadow:0 0 5px rgba(52,152,219,0.5);
}

/* Button */
.login-box button{
  width:100%;
  padding:10px;
  background:#3498db;
  color:white;
  border:none;
  border-radius:5px;
  font-size:16px;
  cursor:pointer;
}

/* Button hover */
.login-box button:hover{
  background:#2980b9;
}

</style>
</head>
<body>
   <div class="login-box">
  <h2>Login</h2>

  <form>
    <input type="text" placeholder="Username" required>
    <input type="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

</div> 
</body>
</html>
